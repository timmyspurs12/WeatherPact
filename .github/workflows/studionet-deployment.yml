name: Studionet deployment

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full 40-character commit SHA approved for this deployment
        required: true
        type: string
      contract_sha256:
        description: SHA-256 of the approved contracts/weatherpact.py
        required: true
        type: string
      deployment_tx:
        description: Existing deployment transaction to resume; leave blank only for a new submission
        required: false
        type: string
      expected_deployer:
        description: Expected public address of the encrypted deployment account
        required: true
        default: '0x96523f15a671772D498E27176B80A20A76077314'
        type: string

permissions:
  contents: read

concurrency:
  group: studionet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded deployment or same-transaction resume
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GENLAYER_NETWORK: studionet
      GENLAYER_NODE_RPC_URL: https://studio.genlayer.com/api
      WEATHERPACT_CONTRACT_ADDRESS: ''
      WEATHERPACT_DEPLOYMENT_JOURNAL: ${{ runner.temp }}/weatherpact-deployment.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate the approved source and qualify Studionet read-only
        id: preflight
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.contract_sha256 }}
          DEPLOYMENT_TX: ${{ inputs.deployment_tx }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full approved commit SHA is required.' >&2
            exit 1
          fi
          actual_commit=$(git rev-parse HEAD)
          if [[ "${actual_commit,,}" != "${EXPECTED_COMMIT,,}" ]]; then
            echo "Checked-out commit $actual_commit does not match the approved commit." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'A full approved contract SHA-256 is required.' >&2
            exit 1
          fi
          actual_sha256=$(sha256sum contracts/weatherpact.py | awk '{print $1}')
          if [[ "${actual_sha256,,}" != "${EXPECTED_SHA256,,}" ]]; then
            echo 'Contract source digest does not match the approved source.' >&2
            exit 1
          fi
          if [ -n "$DEPLOYMENT_TX" ] && [[ ! "$DEPLOYMENT_TX" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo 'The resume transaction ID is malformed.' >&2
            exit 1
          fi
          npm run verify:network
          echo "contract_sha256=$actual_sha256" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Restore only the encrypted account and verify its public identity/funds
        if: inputs.deployment_tx == ''
        env:
          WEATHERPACT_STUDIONET_KEYSTORE: ${{ secrets.WEATHERPACT_STUDIONET_KEYSTORE }}
          EXPECTED_DEPLOYER: ${{ inputs.expected_deployer }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.genlayer/keystores"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { homedir } from 'node:os';
          import { join } from 'node:path';
          const value = process.env.WEATHERPACT_STUDIONET_KEYSTORE;
          if (!value) throw new Error('The encrypted Studionet keystore secret is not configured.');
          const keystore = JSON.parse(value);
          if (!keystore.address || !(keystore.crypto || keystore.Crypto)) {
            throw new Error('The Studionet secret is not an encrypted keystore.');
          }
          const path = join(homedir(), '.genlayer', 'keystores', 'weatherpact-deployer.json');
          writeFileSync(path, value.endsWith('\n') ? value : `${value}\n`, { mode: 0o600 });
          JS
          unset WEATHERPACT_STUDIONET_KEYSTORE
          ./node_modules/.bin/genlayer account use weatherpact-deployer
          ./node_modules/.bin/genlayer network set studionet
          node scripts/verify-deployment-account.mjs "$EXPECTED_DEPLOYER"

      - name: Submit once and record the deployment transaction immediately
        id: deploy
        if: inputs.deployment_tx == ''
        env:
          WEATHERPACT_KEYSTORE_PASSWORD: ${{ secrets.WEATHERPACT_STUDIONET_KEYSTORE_PASSWORD }}
        run: npm run deploy:contract

      - name: Resume the same transaction through finalization and execution verification
        id: finalize
        if: always() && steps.preflight.outputs.ready == 'true' && (inputs.deployment_tx != '' || steps.deploy.outputs.resume_allowed == 'true')
        env:
          WEATHERPACT_CONTRACT_SOURCE_SHA256: ${{ steps.preflight.outputs.contract_sha256 }}
        run: |
          set -euo pipefail
          hash='${{ inputs.deployment_tx }}'
          if [ -z "$hash" ]; then
            hash='${{ steps.deploy.outputs.transaction_hash }}'
          fi
          node --env-file-if-exists=.env scripts/finalize-deployment.mjs "$hash" | tee "$RUNNER_TEMP/weatherpact-finalization.json"

      - name: Verify deployed code, schema, and get_metadata through gen_call
        if: steps.finalize.outputs.contract_address != ''
        env:
          WEATHERPACT_CONTRACT_ADDRESS: ${{ steps.finalize.outputs.contract_address }}
        run: npm run verify:network -- --require-contract

      - name: Publish only public deployment evidence
        if: always() && (inputs.deployment_tx != '' || steps.deploy.outputs.transaction_hash != '' || steps.finalize.outputs.transaction_hash != '')
        uses: actions/upload-artifact@v4
        with:
          name: weatherpact-studionet-deployment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/weatherpact-deployment.json
            ${{ runner.temp }}/weatherpact-finalization.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove restored key material
        if: always()
        run: rm -f "$HOME/.genlayer/keystores/weatherpact-deployer.json"
