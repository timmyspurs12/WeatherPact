name: Portal contribution discovery

on:
  push:
    branches:
      - arena/c6a5a95b-weatherpact
    paths:
      - .github/workflows/portal-discovery.yml
      - scripts/probe-portal.cjs

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate the runner browser
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          if [ -z "$browser" ]; then
            echo 'No preinstalled Chromium browser found.'
            exit 1
          fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
      - name: Install the temporary browser driver
        run: npm install --prefix /tmp/weatherpact-portal-probe playwright-core@1.56.1 --no-audit --no-fund
      - name: Inspect public Portal navigation and application schema
        run: node scripts/probe-portal.cjs
