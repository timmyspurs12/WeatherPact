name: Bradbury qualification

on:
  push:
    branches:
      - arena/83ab2069-weatherpact
    paths:
      - .github/workflows/bradbury-qualification.yml
  workflow_dispatch:
    inputs:
      node_rpc:
        description: GenLayer node RPC to qualify (never a private key or URL credential)
        required: true
        default: https://rpc.testnet-chain.genlayer.com
        type: string
      chain_rpc:
        description: Independent Bradbury chain RPC
        required: true
        default: https://rpc.testnet-chain.genlayer.com
        type: string
      contract_address:
        description: Optional deployed WeatherPact address for post-deployment verification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bradbury-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect the pinned CLI and built-in Bradbury profile
        run: |
          ./node_modules/.bin/genlayer --version
          ./node_modules/.bin/genlayer network set testnet-bradbury
          ./node_modules/.bin/genlayer network info
      - name: Run the unchanged read-only network and contract guard
        env:
          GENLAYER_NODE_RPC_URL: ${{ inputs.node_rpc || 'https://rpc.testnet-chain.genlayer.com' }}
          GENLAYER_CHAIN_RPC_URL: ${{ inputs.chain_rpc || 'https://rpc.testnet-chain.genlayer.com' }}
          WEATHERPACT_CONTRACT_ADDRESS: ${{ inputs.contract_address }}
        run: |
          args=()
          if [ -n "$WEATHERPACT_CONTRACT_ADDRESS" ]; then
            args+=(--require-contract)
          fi
          set +e
          output=$(npm run verify:network -- "${args[@]}" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          escaped=${output//'%'/'%25'}
          escaped=${escaped//$'\r'/'%0D'}
          escaped=${escaped//$'\n'/'%0A'}
          printf '::notice title=Bradbury guard output::%s\n' "$escaped"
          exit "$status"
      - name: Diagnose gen_call availability after a guard failure
        if: failure()
        env:
          GENLAYER_NODE_RPC_URL: ${{ inputs.node_rpc || 'https://rpc.testnet-chain.genlayer.com' }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from 'genlayer-js';
          import { testnetBradbury } from 'genlayer-js/chains';
          import { TransactionHashVariant } from 'genlayer-js/types';

          const client = createClient({
            chain: testnetBradbury,
            endpoint: process.env.GENLAYER_NODE_RPC_URL,
          });
          let message;
          try {
            await client.readContract({
              address: '0x0000000000000000000000000000000000000000',
              functionName: 'get_metadata',
              args: [],
              transactionHashVariant: TransactionHashVariant.LATEST_FINAL,
            });
            message = 'gen_call returned from the zero-address diagnostic; this is not a contract verification.';
          } catch (error) {
            message = `gen_call diagnostic: ${error instanceof Error ? error.message : String(error)}`;
          }
          console.log(message);
          const escaped = message
            .replaceAll('%', '%25')
            .replaceAll('\r', '%0D')
            .replaceAll('\n', '%0A');
          console.log(`::notice title=gen_call diagnostic::${escaped}`);
          NODE
