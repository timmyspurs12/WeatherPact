name: Final Bradbury candidate probe

on:
  push:
    branches:
      - arena/c6a5a95b-weatherpact
    paths:
      - .github/workflows/bradbury-candidate-final-probe.yml
      - scripts/probe-bradbury-candidate.mjs

permissions:
  contents: read

concurrency:
  group: final-bradbury-candidate-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect the pinned CLI and built-in Bradbury profile
        run: |
          ./node_modules/.bin/genlayer --version
          ./node_modules/.bin/genlayer network set testnet-bradbury
          ./node_modules/.bin/genlayer network info
      - name: Capture raw candidate, chain, SDK, and CORS responses
        run: node scripts/probe-bradbury-candidate.mjs
      - name: Run the unchanged read-only qualification guard
        if: always()
        env:
          GENLAYER_NODE_RPC_URL: https://rpc-bradbury.genlayer.com
          GENLAYER_CHAIN_RPC_URL: https://rpc.testnet-chain.genlayer.com
        run: |
          set +e
          output=$(npm run verify:network 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          escaped=${output//'%'/'%25'}
          escaped=${escaped//$'\r'/'%0D'}
          escaped=${escaped//$'\n'/'%0A'}
          printf '::notice title=Unchanged guard result::%s\n' "$escaped"
          exit "$status"
